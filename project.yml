# Проект Xcode собирается из этого файла (XcodeGen): `xcodegen generate` → Torgana.xcodeproj.
# Сам .xcodeproj в репозиторий не кладём — его создаёт сборка (GitHub Actions) или `xcodegen` на Mac.
name: Torgana
options:
  bundleIdPrefix: ru.torgana
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Torgana:
    type: application
    platform: iOS
    scheme: {}                           # общая схема Torgana — нужна для xcodebuild в GitHub Actions
    sources:
      - path: Torgana
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.torgana.app
        PRODUCT_NAME: Torgana
        TARGETED_DEVICE_FAMILY: "1"      # только iPhone (iPad — позже). Именно в цели: XcodeGen ставит здесь «1,2» поверх общих настроек
        INFOPLIST_FILE: Torgana/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Torgana/Resources/Torgana.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
